<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
    </head>
    <body>
        <div th:fragment="sidebar">
            <div id="sidebar">
                <h4 class="text-center py-3">SIGEE</h4>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}" aria-current="page">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/chamados}">
                            <i class="bi bi-headset"></i> <span class="d-none d-md-inline">Chamados</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/clientes}">
                            <i class="bi bi-person"></i> <span class="d-none d-md-inline">Clientes</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="toggleSubmenu(event, this)">
                            Configurações
                            <span class="float-end">&#9662;</span> <!-- Setinha -->
                        </a>
                        <ul class="nav flex-column submenu">
                            <li class="nav-item">
                                <a class="nav-link" th:href="@{/ajustes-horarios}">
                                    <i class="bi bi-alarm"></i> <span class="d-none d-md-inline">Horário de Atendimento</span>
                                </a>
                            </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/minha-senha}">
                            <i class="bi bi-key"></i> <span class="d-none d-md-inline">Trocar senha</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="nav-link" th:href="@{/usuarios/novo}">
                            <i class="bi bi-person-plus"></i> <span class="d-none d-md-inline">Cadastrar usuário</span>
                        </a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMINISTRADOR')">
                        <a class="nav-link" th:href="@{/auditoria}">
                            <i class="bi bi-clipboard-check"></i> <span class="d-none d-md-inline">Auditoria</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/logout}" method="post" class="px-3 py-2">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-outline-light btn-sm w-100">
                                <i class="bi bi-box-arrow-right"></i> Sair
                            </button>
                        </form>
                    </li>
                </ul>
                    </li>
                </ul>
            </div>
        </div>
    </body>
</html>
