<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="robots" content="noindex">
    <title>Entrar | SIGEE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/tema-padrao.css}">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }
        .login-card {
            max-width: 400px;
            width: 100%;
            padding: 2rem;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            background-color: #ffffff;
        }
        .logo {
            width: 100px;
            height: auto;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body th:classappend="'tema-' + (${temaNome} ?: 'padrao')">
    <div class="login-container">
        <div class="login-card text-center">
            <img th:src="@{/images/logo.png}" alt="Logo" class="logo">
            <h3 class="mb-1">SIGEE</h3>
            <p class="text-muted mb-4">Entre com as credenciais fornecidas pela instituição.</p>

            <!-- Mensagem neutra: não revela se o usuário existe -->
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Usuário ou senha inválidos.
            </div>
            <div th:if="${param.bloqueado}" class="alert alert-warning" role="alert">
                Muitas tentativas inválidas. Tente novamente em 15 minutos.
            </div>
            <div th:if="${param.logout}" class="alert alert-info" role="alert">
                Sessão encerrada.
            </div>
            <div th:if="${param.redefinida}" class="alert alert-success" role="alert">
                Senha redefinida. Entre com a nova senha.
            </div>

            <form th:action="@{/login}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="form-group mb-3 text-start">
                    <label for="username" class="form-label">Usuário</label>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Digite seu nome de usuário" autocomplete="username" required>
                </div>
                <div class="form-group mb-3 text-start">
                    <label for="password" class="form-label">Senha</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <div class="mt-3">
                <a th:href="@{/esqueci-senha}" class="text-decoration-none">Esqueceu sua senha?</a>
            </div>
            <div class="mt-2 small">
                <a th:href="@{/termos}" class="text-decoration-none">Termos de Uso</a>
                <span>•</span>
                <a th:href="@{/privacidade}" class="text-decoration-none">Privacidade</a>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
