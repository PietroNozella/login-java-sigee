<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Novo Chamado | SIGEE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4" style="max-width: 640px">
        <h2 class="mb-4">Novo Chamado</h2>

        <form th:action="@{/chamados/novo}" th:object="${chamado}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label" for="descricao">Descrição *</label>
                <input class="form-control" id="descricao" th:field="*{descricao}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="tipo">Tipo *</label>
                <input class="form-control" id="tipo" th:field="*{tipo}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="tecnico">Técnico</label>
                <input class="form-control" id="tecnico" th:field="*{tecnico}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="usuario">Usuário</label>
                <input class="form-control" id="usuario" th:field="*{usuario}">
            </div>
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a th:href="@{/chamados}" class="btn btn-secondary">Voltar</a>
        </form>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
