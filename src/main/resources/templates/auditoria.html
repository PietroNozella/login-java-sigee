<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Auditoria | SIGEE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4">
        <h2 class="mb-1">Auditoria</h2>
        <p class="text-muted">Autenticação, acessos negados e ações relevantes. Somente leitura.</p>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Quando</th>
                    <th>Usuário</th>
                    <th>Ação</th>
                    <th>Resultado</th>
                    <th>IP</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${registros}">
                    <td th:text="${r.quando}"></td>
                    <td th:text="${r.usuario}"></td>
                    <td th:text="${r.acao}"></td>
                    <td th:text="${r.resultado}"></td>
                    <td th:text="${r.ip}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
