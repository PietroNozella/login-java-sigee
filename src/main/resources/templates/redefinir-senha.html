<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Redefinir senha | Thindesk</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8f9fa; }
        .login-card { max-width: 440px; width: 100%; padding: 2rem; box-shadow: 0 4px 8px rgba(0,0,0,.2); border-radius: 8px; background-color: #fff; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h3 class="mb-4">Redefinir senha</h3>

            <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>

            <form th:action="@{'/redefinir-senha/' + ${token}}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="senhaNova">Nova senha (mín. 8 caracteres)</label>
                    <input class="form-control" id="senhaNova" type="password" name="senhaNova" autocomplete="new-password" required minlength="8" maxlength="72">
                </div>
                <button type="submit" class="btn btn-primary w-100">Redefinir</button>
            </form>
        </div>
    </div>
</body>
</html>
