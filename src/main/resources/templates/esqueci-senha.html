<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Esqueci minha senha | SIGEE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        .login-container { display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f8f9fa; }
        .login-card { max-width: 440px; width: 100%; padding: 2rem; box-shadow: 0 4px 8px rgba(0,0,0,.2); border-radius: 8px; background-color: #fff; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h3 class="mb-1">Esqueci minha senha</h3>
            <p class="text-muted">Informe o e-mail da conta. O link vale por 60 minutos.</p>

            <div th:if="${ok}" class="alert alert-info" role="status" th:text="${ok}"></div>
            <form th:action="@{/esqueci-senha}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <div class="mb-3">
                    <label class="form-label" for="email">E-mail</label>
                    <input class="form-control" id="email" type="email" name="email" autocomplete="email" required maxlength="254">
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar link</button>
            </form>
            <div class="mt-3 text-center">
                <a th:href="@{/login}" class="text-decoration-none">Voltar ao login</a>
            </div>
        </div>
    </div>
</body>
</html>
