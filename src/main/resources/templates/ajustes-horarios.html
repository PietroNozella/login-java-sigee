<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title>Ajustes de Horários | SIGEE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4">
        <h2 class="mb-4">Ajustes de Horários por Setor</h2>

        <div id="erro" class="alert alert-danger d-none" role="alert"></div>

        <form id="form-horario" class="mb-4" sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
            <div class="row">
                <div class="col-md-3 mb-2">
                    <label class="form-label" for="setor">Setor</label>
                    <input type="text" id="setor" class="form-control" required>
                </div>
                <div class="col-md-2 mb-2">
                    <label class="form-label" for="diaSemana">Dia</label>
                    <input type="text" id="diaSemana" class="form-control" required>
                </div>
                <div class="col-md-2 mb-2">
                    <label class="form-label" for="horarioInicio">Início</label>
                    <input type="time" id="horarioInicio" class="form-control" required>
                </div>
                <div class="col-md-2 mb-2">
                    <label class="form-label" for="horarioFim">Fim</label>
                    <input type="time" id="horarioFim" class="form-control" required>
                </div>
                <div class="col-md-3 d-flex align-items-end mb-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </div>
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Setor</th>
                    <th>Dia</th>
                    <th>Início</th>
                    <th>Fim</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabela-horarios">
                <tr th:each="horario : ${horarios}" th:id="'linha-' + ${horario.id}">
                    <td th:text="${horario?.setor}"></td>
                    <td th:text="${horario?.diaSemana}"></td>
                    <td th:text="${horario?.horarioInicio}"></td>
                    <td th:text="${horario?.horarioFim}"></td>
                    <td sec:authorize="hasAnyRole('ADMINISTRADOR', 'OPERADOR')">
                        <button class="btn btn-danger btn-sm"
                                th:data-id="${horario.id}"
                                onclick="deletarHorario(this)">Deletar</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script th:src="@{/js/script.js}"></script>
    <script>
        const csrfToken = document.querySelector('meta[name="_csrf"]').content;
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        function mostrarErro(msg) {
            const el = document.getElementById('erro');
            el.textContent = msg;
            el.classList.remove('d-none');
        }

        document.getElementById('form-horario').addEventListener('submit', async (e) => {
            e.preventDefault();
            const corpo = {
                setor: document.getElementById('setor').value,
                diaSemana: document.getElementById('diaSemana').value,
                horarioInicio: document.getElementById('horarioInicio').value,
                horarioFim: document.getElementById('horarioFim').value
            };
            const resp = await fetch('/api/ajustes-horarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify(corpo)
            });
            if (!resp.ok) {
                mostrarErro('Não foi possível salvar. Verifique sua permissão.');
                return;
            }
            window.location.reload();
        });

        async function deletarHorario(btn) {
            const id = btn.getAttribute('data-id');
            const resp = await fetch('/api/ajustes-horarios/' + id, {
                method: 'DELETE',
                headers: { [csrfHeader]: csrfToken }
            });
            if (!resp.ok) {
                mostrarErro('Não foi possível deletar. Verifique sua permissão.');
                return;
            }
            document.getElementById('linha-' + id).remove();
        }
    </script>
</body>
</html>
