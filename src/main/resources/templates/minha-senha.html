<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trocar senha | Thindesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4" style="max-width: 520px">
        <h2 class="mb-4">Trocar senha</h2>

        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
        <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>

        <form th:action="@{/minha-senha}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="mb-3">
                <label class="form-label" for="senhaAtual">Senha atual</label>
                <input class="form-control" id="senhaAtual" type="password" name="senhaAtual" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senhaNova">Nova senha (mín. 8 caracteres)</label>
                <input class="form-control" id="senhaNova" type="password" name="senhaNova" autocomplete="new-password" required minlength="8">
            </div>
            <button class="btn btn-primary" type="submit">Salvar</button>
            <a th:href="@{/}" class="btn btn-secondary">Voltar</a>
        </form>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
