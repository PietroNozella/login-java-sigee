<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastrar usuário | Thindesk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <aside>
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    </aside>

    <div class="container mt-4" style="max-width: 640px">
        <h2 class="mb-1">Cadastrar usuário</h2>
        <p class="text-muted">Crie uma conta comum e atribua um único perfil funcional.</p>

        <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
        <div th:if="${ok}" class="alert alert-success" role="status" th:text="${ok}"></div>

        <form th:action="@{/usuarios/novo}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="nome">Nome *</label>
                    <input class="form-control" id="nome" name="nome" autocomplete="given-name" required maxlength="150">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label" for="sobrenome">Sobrenome *</label>
                    <input class="form-control" id="sobrenome" name="sobrenome" autocomplete="family-name" required maxlength="150">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="email">E-mail *</label>
                <input class="form-control" id="email" type="email" name="email" autocomplete="email" required maxlength="254">
            </div>
            <div class="mb-3">
                <label class="form-label" for="username">Nome de usuário *</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required maxlength="150">
            </div>
            <div class="mb-3">
                <label class="form-label" for="perfil">Perfil *</label>
                <select class="form-select" id="perfil" name="perfil" required>
                    <option value="">Selecione um perfil</option>
                    <option th:each="p : ${perfis}" th:value="${p}" th:text="${p}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" for="senha">Senha inicial * (mín. 8 caracteres)</label>
                <input class="form-control" id="senha" type="password" name="senha" autocomplete="new-password" required minlength="8">
            </div>
            <button class="btn btn-primary" type="submit">Cadastrar usuário</button>
            <a th:href="@{/}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
