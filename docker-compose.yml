services:
  mongo:
    image: mongo:7
    container_name: login-sigee-mongo
    ports:
      - "27018:27017"
    volumes:
      - login-sigee-mongo-data:/data/db
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: login-sigee-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  app:
    build: .
    container_name: login-sigee-app
    ports:
      - "8080:8080"
    depends_on:
      - mongo
      - mailpit
    env_file:
      - path: .env
        required: false
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/loginsigee}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Defina APP_ADMIN_PASSWORD no arquivo .env}
    restart: unless-stopped

volumes:
  login-sigee-mongo-data:
